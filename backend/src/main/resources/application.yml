server:
  port: 8081
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/data_governance?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password:
      database: 1 #注意，这里用DB1
      timeout: 3000ms

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.mp.domain.po

# AI 服务地址（本地默认 localhost，Docker 部署由环境变量 AI_SERVICE_URL 覆盖）
ai:
  service:
    base-url: ${AI_SERVICE_URL:http://localhost:8011}

xxl:
  job:
    admin:
      addresses: http://localhost:8080
      timeout: 3

    executor:
      enabled: true
      appname: ai-data-governance-executor
      accessToken: default_token
      address: http://host.docker.internal:9999
      ip: host.docker.internal
      port: 9999
      logpath: ./logs/xxl-job
      logretentiondays: 30
