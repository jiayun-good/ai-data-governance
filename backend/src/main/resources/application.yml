server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/data_governance?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.mp.domain.po

xxl:
  job:
    admin:
      addresses: http://localhost:8080
      timeout: 3

    executor:
      enabled: true
      appname: ai-data-governance-executor
      accessToken: default_token
      address: http://host.docker.internal:9999
      ip: host.docker.internal
      port: 9999
      logpath: ./logs/xxl-job
      logretentiondays: 30